version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      desarrollo:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x solo soporta TypeScript < 6.1. Quitar cuando soporte TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
